[package]
name = "trible"
version = "0.47.0"
authors = ["⚫️ <jp@bultmann.eu>"]
edition = "2021"
description = "A knowledge graph and meta file system for object stores."
homepage = "https://tribles.space"
repository = "https://github.com/triblespace/trible"
license = "MIT"
readme = "README.md"
keywords = [
    "cli",
    "tribles",
    "knowledge-graph",
    "filesystem",
    "object-store",
]
categories = [
    "command-line-utilities",
    "filesystem",
    "database-implementations",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.57", features = ["derive", "env"] }
clap_complete = "4.5.65"
anyhow = "1.0.101"
getrandom = "0.4.1"
hex = "0.4.3"
memchr = "2.7.6"
triblespace = { version = "0.47.0", path = "..", default-features = false }
# Select Core's parallel PATCH, archive-construction and large-Pile-validation
# paths explicitly, including lean CLI builds. Ordinary Blob::new hashing is
# unchanged. Available parallelism is still bounded by the runtime pool and
# deployment quota; enabling these paths alone is not a throughput claim.
triblespace-core = { version = "0.47.0", path = "../triblespace-core", default-features = false, features = ["object-store", "parallel"] }
triblespace-gpu = { version = "0.47.0", path = "../triblespace-gpu", default-features = false, optional = true }
triblespace-paths = { path = "../triblespace-paths" }
anybytes = "0.20"
triblespace-search = { path = "../triblespace-search", optional = true }
file_type = "0.8"
chrono = "0.4"
hifitime = "4.1.2"
object_store = { version = "0.13.1", default-features = false, features = ["aws", "fs"] }
url = "2"
ed25519-dalek = "2.2.0"
iroh-base = "1.0"
iroh-tickets = "1.0"
triblespace-net = { version = "0.47.0", path = "../triblespace-net" }
blake3 = "1.8"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.3"
tempfile = "3.24.0"
blake3 = "1.8.3"

[features]
default = ["search"]
# Maintain both stored-vector and model-derived semantic indexes. On by default
# so the CLI can dispatch the concrete mapping named by a search descriptor;
# the price is that the search crate brings the model crate with it. Build with
# --no-default-features for a lean daemon.
search = ["dep:triblespace-search", "triblespace-search/semantic"]
# Explicit execution choice for bounded, externally reserved CUDA maintenance.
# CPU remains the command default, including when this feature is compiled.
succinct-cuda = ["dep:triblespace-gpu", "triblespace-gpu/cuda"]
