[package]
name = "tribleset-bench"
version = "0.1.0"
edition = "2021"
description = "Engine-version-agnostic benchmark suite for triblespace. The SUBJECT engine is a repointable dependency (any checkout, any era — no history grafting); results are written as canonical telemetry sessions/spans through the stable LEDGER dependency. The minted schema ids are the contract; GORBIE's telemetry-viewer renders the axis."

[features]
# EMPTY BY DESIGN. Every capability feature below couples the suite to a
# specific engine ERA; enabling one by default would break the crate's whole
# purpose (benchmarking any rev). bench.sh probes the subject and enables
# exactly the ones it supports.
default = []
# The benchmark normally reads legacy pile heads through the current immutable
# snapshot API. History subjects predating that API can still be swept by
# enabling this adapter; it is never part of a current production surface.
legacy-repository = []
# The performance fingerprint is a reader for benchmark receipts, not part of
# the measured process. Keeping it behind a feature means ordinary subject
# builds never compile an eframe/wgpu UI into the benchmark runner.
fingerprint-notebook = ["dep:GORBIE", "dep:egui", "dep:egui_plot"]
# Marker consumed by GORBIE's notebook macro when its `--export` path is used.
# Declaring it also lets Cargo's check-cfg understand the macro expansion.
web-export = []
# Placeholder: compiles only once the subject engine regains a
# regular-path constraint (`path!`). Gates the four transitive-path
# sparqloscope translations and the path-shaped Harkonnen fixtures
# (F1/F2/F4); with the feature off those record SKIP outcomes.
rpq = []
# F11 implements `Constraint` by hand, so it only compiles against the
# post-`Candidates` protocol (engine/owned-mask, 2026-07-27 onward).
# Subjects older than that record F11 as skip:protocol.
protocol-v2 = []
# `propose`/`confirm` take a `Frontier` (a batch of parent bindings)
# instead of one `Binding`, and `propose_chunk`/`ProposeCursor` are gone
# (engine/batched-frontier, 2026-07-28 onward). Refines `protocol-v2`:
# the hand-written wrappers in F11 and the confirm-region census pick
# their method signatures off this. Never enable it without
# `protocol-v2` — bench.sh only ever probes for it alongside.
frontier = []
# `FrontierStats` gained `widest`/`inplace_descents`/`copied_descents`
# (engine/batched-frontier-harvest, 2026-07-28 onward). The batched
# protocol shipped before those counters existed, so the census reports
# expansions and mean width against a plain `frontier` subject and the
# ceiling question only against one that can answer it. Refines
# `frontier`; never enable it alone.
frontier-widest = []
# The W=1 control arm: pins every translated query to
# `with_frontier_width(1)`, reducing the SAME engine to expanding one
# binding at a time. Not a capability probe — a deliberate ablation, so
# bench.sh never enables it; build the control arm by hand. See the note
# at `queries::run` for what the resulting gap does and does not measure.
frontier-w1 = ["frontier"]
# F10 straddles `triblespace-gpu`'s `DEFAULT_MIN_CONFIRM_BATCH` and READS
# the constant out of the subject rather than copying it, so the fixture
# can only compile against a subject that ships the gpu crate (the
# default since 3d9d8c72). On by default — a subject old enough to lack
# it is benched with `--no-default-features`, and F10 records SKIP.
# Forwards to the SUBJECT's own gpu feature: enabling it here without
# enabling it there leaves `subject::gpu` gated out (revs where gpu is not
# yet in the subject's default set).
gpu = ["subject/gpu"]

[dependencies]
# The engine under test. `subjects/current` is a symlink managed by
# bench.sh; the checked-in default target is `../..` — the enclosing
# triblespace-rs repo, so a fresh clone builds the current checkout
# as the subject with no setup. Repoint it at any worktree to bench
# any rev (`./bench.sh <rev-or-path> …`; `git checkout -- subjects/
# current` restores the default). The suite restricts itself to the
# stable macro surface (find!/pattern!/TriblePattern) — the discipline
# proven era-portable across 441 commits and three engine eras.
subject = { package = "triblespace", path = "subjects/current", version = "0.47.0" }
# Direct handle on the subject's CORE crate. The core proc macros the
# vendored queries use (pattern!/entity!/attributes! via
# subject::core::prelude) expand to absolute `::triblespace_core::…`
# paths, which must resolve in THIS crate's extern prelude — to the
# same crate instance `subject::core` re-exports. Pointing at the same
# path the subject's own core dep uses makes cargo unify the two.
triblespace_core = { package = "triblespace-core", path = "subjects/current/triblespace-core", version = "0.47.0" }
# The results ledger: a stable native-collection revision, used ONLY to
# write/read sessions, spans, and outcome entities. Measurement I/O never
# depends on the era of the subject. The exact git revision keeps the two
# package instances separate even when bench.sh repoints the SUBJECT to an
# older checkout. Ledger-side code (src/ledger.rs) must use ONLY the umbrella
# macros (`triblespace::prelude`/`triblespace::macros`) — they expand to
# `::triblespace::core` paths, which resolve to this dep; the core-macro flavor
# would leak to the subject's core.
triblespace = { version = "0.47.0", path = ".." }
anyhow = "1"
# Serve the vendored queries: blob views, SPARQL regex functions, and
# the NsTAIInterval date folds. anybytes must unify with the subject
# core's own requirement so `View` is one type.
anybytes = { version = "0.20.3", path = "../../anybytes" }
regex = "1"
hifitime = "4.1.2"
# Collection signing, plus throwaway legacy Repository signing only when the
# history-sweep adapter is selected. 2.1 unifies with both graphs.
ed25519-dalek = { version = "2.1.0", features = ["rand_core"] }
rand = "0.8"
# GORBIE 0.18.1's CardCtx calls its markdown helper unconditionally, so this
# feature is required even though the fingerprint itself uses plain egui text.
GORBIE = { version = "0.19.0", features = ["markdown"], optional = true, package = "lissajous", path = "../../GORBIE" }
egui = { version = "0.34", optional = true }
egui_plot = { version = "0.35", optional = true }

[[bin]]
name = "performance-fingerprint"
path = "src/bin/performance-fingerprint/main.rs"
required-features = ["fingerprint-notebook"]
