[package]
name = "triblespace-search"
version = "0.47.0"
edition = "2021"
# The search crate depends directly on triblespace-core, whose verified MSRV
# is 1.89. Advertising an older compiler here only defers the same failure to
# dependency resolution.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Content-addressed full-text and exact embedding search over TribleSpace collections."
authors = ["Jan-Paul Bultmann <jp@bultmann.eu>"]
homepage = "https://trible.space"
repository = "https://github.com/triblespace/triblespace-rs"
documentation = "https://docs.rs/triblespace-search"
readme = "README.md"
keywords = ["triblespace", "bm25", "hnsw", "search", "succinct"]
categories = ["data-structures", "text-processing"]
# Keep the crates.io tarball lean: tests + examples ship, but
# generated / cache-only artifacts don't.
exclude = ["target/", "Cargo.lock", ".git/"]

[dev-dependencies]
ed25519-dalek = "2.1.0"
futures = "0.3"
# tempfile — used by integration tests that exercise an on-disk
# triblespace Pile round-trip. Already in the tree via triblespace
# transitively; declaring it here keeps the tests building even
# if the transitive chain changes.
tempfile = "3"

[dependencies]
# Depend directly on `triblespace-core` rather than the umbrella
# `triblespace` crate. The macros come from `triblespace_core::macros::*`
# (re-exported from `triblespace-core-macros`), which emit
# `::triblespace_core::…` absolute paths — so no umbrella
# crate is needed in the dep graph. Search deliberately remains a downstream
# capability rather than becoming part of the core facade.
triblespace-core = { version = "0.47.0", path = "../triblespace-core", default-features = false }
# Mary owns reusable numerical representations and accelerator arithmetic.
# This crate owns only their collection/storage integration and exact reranking.
mary = { version = "0.1.0", path = "../../mary" }
# PDF text layers for the semantic index (`semantic` feature only): a typed
# document carries its text; a scanned one does not, and needs an OCR model.
lopdf = { version = "0.44", default-features = false, optional = true }
# Image format probing for the same classification; the decoders themselves
# live in mary's embedder.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"], optional = true }
anybytes = "0.20"
# jerky — succinct data structures; optional for the v1 scaffold,
# required once we flip from flat-array prototypes to the
# wavelet-matrix-backed blobs.
jerky = { version = "0.9", git = "https://github.com/triblespace/jerky.git", rev = "fc0be54529f6bc0a6c5e7312cd649de21a7f3316", optional = true }
# zerocopy — safe byte<->struct conversion for serializing
# jerky's CompactVectorMeta into the succinct blob header. Pulled
# in along with jerky, so no added transitive cost.
zerocopy = { version = "0.8", features = ["derive"], optional = true }
# blake3 — for `hash_tokens` helper (callers hash their own tokens
# into 32-byte triblespace Values).
blake3 = "1"
# unicode-properties + unicode-segmentation — keep non-ASCII symbols
# (including emoji sequences) searchable as complete grapheme clusters.
unicode-properties = "0.1.4"
# 1.13 raised its MSRV to 1.85; this crate still promises Rust 1.80.
unicode-segmentation = "=1.12.0"
[features]
default = ["succinct"]
# The semantic index: rows embedded straight from source facts through the
# nomic models in the same pile (`semantic` module). Pulls mary's embedders.
semantic = ["mary/embed", "dep:lopdf", "dep:image"]
# The production execution path targets the provisioned GB10/Spark appliance.
nvfp4-cuda = ["mary/nvfp4-cuda"]
# Swap the naive flat-array implementations for the succinct
# jerky-backed ones. On until we have both working; off lets us
# test the naive path in isolation.
succinct = ["dep:jerky", "dep:zerocopy"]

[package.metadata.docs.rs]
all-features = true
